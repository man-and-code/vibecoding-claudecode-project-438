findings:
  - id: f1
    claim: "Информация о новых контактах после мероприятия оказывается в нескольких разных местах: мессенджер, телефон, фотографии, заметки. Подтверждено обоими интервью."
    status: confirmed_multiple
    evidence:
      - source: interviews/01-kirill.md
        question: 7
        quote: "Telegram, контакты телефона, фотографии, заметки."
      - source: interviews/02-maxim.md
        question: 2
        quote: "Почти все сразу в Telegram или телефоне. Визиток было немного. Ещё были фотографии и несколько сообщений самому себе."

  - id: f2
    claim: "После мероприятия человек вручную просматривает накопившиеся контакты и сам решает, кому написать в первую очередь. Подтверждено обоими интервью."
    status: confirmed_multiple
    evidence:
      - source: interviews/01-kirill.md
        question: 4
        quote: "На следующий день начал разбирать: смотрел переписки, фотографии и визитки, вспоминал разговоры и выписывал тех, кому нужно написать."
      - source: interviews/02-maxim.md
        question: 4
        quote: "Просмотрел список, выбрал несколько действительно нужных и написал им. Остальные так и остались в контактах."

  - id: f3
    claim: "Иногда требуется восстанавливать контекст знакомства по переписке, фотографиям или заметкам, хотя не по каждому контакту. Подтверждено обоими интервью."
    status: confirmed_multiple
    evidence:
      - source: interviews/01-kirill.md
        question: 6
        quote: "Да. Было несколько человек, которых я помнил визуально, но уже не мог сразу вспомнить, о чём именно мы говорили. Искал по переписке и фотографиям."
      - source: interviews/02-maxim.md
        question: 3
        quote: "Обычно помню. Если нет — смотрю первые сообщения в Telegram. Иногда специально сразу после разговора отправляю себе короткую заметку."

  - id: f4
    claim: "Разбор контактов после мероприятия занимает заметное время — от полутора до трёх часов суммарно, растянутых на несколько подходов. Подтверждено обоими интервью."
    status: confirmed_multiple
    evidence:
      - source: interviews/01-kirill.md
        question: 9
        quote: "Думаю, часа три суммарно. Сначала около двух часов на следующий день и потом ещё примерно час возвращался к этому."
      - source: interviews/02-maxim.md
        question: 9
        quote: "Примерно полтора-два часа. Где-то час вечером просмотрел всё и потом ещё минут сорок-пятьдесят возвращался к отдельным контактам."

  - id: f5
    claim: "Единичный случай: в первую очередь пишут тем, с кем была конкретная договорённость, а остальных сортируют по субъективной перспективности контакта."
    status: single_case
    evidence:
      - source: interviews/01-kirill.md
        question: 5
        quote: "В первую очередь тем, с кем была конкретная договорённость. Остальных уже сортировал по тому, насколько контакт казался перспективным."

  - id: f6
    claim: "Единичный случай, противоречащий гипотезе о потере контактов: часть контактов может быть разобрана слишком поздно, но действительно важные контакты при этом не терялись."
    status: single_case
    evidence:
      - source: interviews/01-kirill.md
        question: 10
        quote: "Один или два контакта я разобрал слишком поздно и уже не стал писать. Но чтобы какой-то действительно важный контакт совсем потерялся — такого не было."

  - id: f7
    claim: "Единичный случай, противоречащий гипотезе о недостаточности существующих инструментов: нынешний способ в целом устраивает и не оправдывает создание отдельной сложной системы при текущем количестве мероприятий."
    status: single_case
    evidence:
      - source: interviews/02-maxim.md
        question: 10
        quote: "В целом устраивает. Если мероприятий станет намного больше, хотелось бы меньше переносить руками. Но ради нескольких мероприятий в год отдельную сложную систему я бы заводить не стал."

  - id: f8
    claim: "Единичный случай: в постоянное хранилище контактов переносят не всех новых знакомых, а только тех, с кем решено продолжать общение, и именно это решение требует больше всего ручной работы, а не само добавление контакта."
    status: single_case
    evidence:
      - source: interviews/02-maxim.md
        question: 7
        quote: "Для важных рабочих вещей есть таблица. Но всех новых людей туда не переношу, только тех, с кем реально собираюсь продолжать общение."
      - source: interviews/02-maxim.md
        question: 8
        quote: "Наверное, решить, кого вообще стоит переносить в таблицу и что по нему записать. Само добавление контактов много времени не занимает."
